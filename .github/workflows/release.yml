name: Release REM (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (win-x64)
        run: dotnet restore REM/REM.csproj -r win-x64

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $ver = $tag.TrimStart('v', 'V')
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = '1.0.0' }
          dotnet publish REM/REM.csproj --no-restore -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -p:Version=$ver -p:AssemblyVersion=$ver.0 -p:FileVersion=$ver.0 -p:InformationalVersion=$ver -o publish/REM-win-x64

      - name: Clean debug symbols, package ZIP & build delta manifest
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $ver = $tag.TrimStart('v', 'V')
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = '1.0.0' }
          Get-ChildItem -Path "publish/REM-win-x64" -Filter "*.pdb" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          if (Test-Path "publish/REM-win-x64/Tools") {
            Remove-Item "publish/REM-win-x64/Tools/*.exe" -Force -ErrorAction SilentlyContinue
          }
          Copy-Item "Update-REM.cmd" "publish/REM-win-x64/Update-REM.cmd" -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if (Test-Path "REM-win-x64.zip") { Remove-Item "REM-win-x64.zip" -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path "publish/REM-win-x64").Path, (Join-Path (Get-Location).Path "REM-win-x64.zip"), [System.IO.Compression.CompressionLevel]::Optimal, $false)
          & ./scripts/build-update-manifest.ps1 -PublishDir "publish/REM-win-x64" -ZipPath "REM-win-x64.zip" -Version $ver -Tag $tag -OutputPath "update-manifest.json"
          $zipHash = (Get-FileHash "REM-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manHash = (Get-FileHash "update-manifest.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $cmdHash = (Get-FileHash "Update-REM.cmd" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  REM-win-x64.zip"
            "$manHash  update-manifest.json"
            "$cmdHash  Update-REM.cmd"
          ) | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            REM-win-x64.zip
            update-manifest.json
            Update-REM.cmd
            SHA256SUMS.txt
